[project]
name = "retail-ai-agent"
version = "0.1.0"
description = "A CLI SQL assistant for theLook"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28,<1",
    "rich>=13,<16",
    "dishka>=1.7,<2",
    "google-cloud-bigquery>=3.47.0",
    "langchain>=1.4.8,<2",
    "langchain-core>=1.7.4,<2",
    "langchain-community>=0.4.2,<0.5",
    "langchain-google-genai>=4.4.2",
    "langchain-openai>=1,<2",
    "langgraph>=1.2.19,<2",
    "pydantic>=2.12.0",
    "pydantic-settings>=2.12.0",
    "sqlglot>=28,<31",
    "sqlalchemy>=2,<3",
    "sqlalchemy-bigquery>=1.17.3,<2",
    "typer>=0.20,<1",
    "presidio-analyzer>=2.2,<3",
    "en-core-web-sm",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project.scripts]
retail-agent = "retail_ai_agent.presentation.cli:main"

[dependency-groups]
dev = ["ruff>=0.14"]
notebook = [
    "google-cloud-bigquery[pandas]>=3.47.0",
    "ipykernel>=7.4.0",
    "python-dotenv>=1.2.4",
]

[tool.ruff]
line-length = 100

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
